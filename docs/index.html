<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumio AI — Documentos Legais</title>
  <style>
    :root {
      --bg: #060606;
      --surface: #14141d;
      --border: #252536;
      --accent: #a78bfa;
      --text: #e2e2f0;
      --muted: #9090b0;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    header { text-align: center; margin-bottom: 20px; }
    header .logo { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
    header h1 { font-size: clamp(20px,4.5vw,26px); font-weight: 800; color: #fff; line-height: 1.2; }
    header p { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .cards { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      text-decoration: none;
      color: var(--text);
      transition: border-color .2s, transform .2s, background .2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .card:hover { border-color: var(--accent); background: #1a1a26; transform: translateY(-2px); }
    .card:active { transform: translateY(0); }
    .card .icon { font-size: 22px; flex-shrink: 0; }
    .card .info { flex: 1; min-width: 0; }
    .card h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .card p { font-size: 12px; color: var(--muted); line-height: 1.35; }
    .card .arrow { color: var(--accent); font-size: 16px; font-weight: 700; flex-shrink: 0; }
    footer { margin-top: 24px; text-align: center; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
<header>
  <div class="logo">Lumio AI</div>
  <h1>Documentos Legais</h1>
  <p>Acesse os Termos de Uso e a Política de Privacidade.</p>
</header>

<div class="cards">
  <a class="card" href="terms.html">
    <div class="icon">📋</div>
    <div class="info">
      <h2>Termos de Uso</h2>
      <p>Condições de uso, assinaturas, conduta e isenções.</p>
    </div>
    <div class="arrow">&rarr;</div>
  </a>
  <a class="card" href="privacy.html">
    <div class="icon">🔒</div>
    <div class="info">
      <h2>Política de Privacidade</h2>
      <p>Tratamento, segurança e proteção dos seus dados.</p>
    </div>
    <div class="arrow">&rarr;</div>
  </a>
</div>

<footer>
  <p>&copy; 2026 Lumio AI. Todos os direitos reservados.</p>
</footer>
</body>
</html>
